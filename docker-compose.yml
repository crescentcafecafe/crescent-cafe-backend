# Local development:  docker compose up --build
# Tests (PostgreSQL): docker compose --profile test run --rm tests
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cafe, POSTGRES_PASSWORD: cafe, POSTGRES_DB: cafe }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cafe"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["redis"]   # optional: docker compose --profile redis up

  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://cafe:cafe@db:5432/cafe
      DB_USE_PGBOUNCER: "false"
      DB_SSL_REQUIRE: "false"
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      LOG_JSON: "false"
    ports: ["8000:8000"]
    volumes: [media:/app/media]

  tests:
    build: { context: ., dockerfile: Dockerfile.test }
    profiles: ["test"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://cafe:cafe@db:5432/cafe
volumes: { pgdata: {}, media: {} }
