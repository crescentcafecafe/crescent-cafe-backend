name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cafe, POSTGRES_PASSWORD: cafe, POSTGRES_DB: cafe_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cafe" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cafe:cafe@localhost:5432/cafe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Tests (PostgreSQL, includes concurrency tests)
        run: pytest
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://cafe:cafe@localhost:5432/cafe_test
          DB_USE_PGBOUNCER: "false"
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text
          async def main():
              e = create_async_engine(os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+asyncpg://"))
              async with e.begin() as c:
                  await c.execute(text("DROP SCHEMA public CASCADE")); await c.execute(text("CREATE SCHEMA public"))
              await e.dispose()
          asyncio.run(main())
          PY
          alembic upgrade head
          alembic check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crescent-cafe-api .
